services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - promokote

  backend:
    image: ghcr.io/sjkcodez/promokote-backend:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_ENGINE: django.db.backends.postgresql
      DB_HOST: db
      DB_PORT: "5432"
    ports:
      - "8027:8000"
    networks:
      - promokote

  frontend:
    image: ghcr.io/sjkcodez/promokote-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3027:80"
    networks:
      - promokote

volumes:
  postgres_data:

networks:
  promokote:
    driver: bridge

