name: Build and Deploy

on:
  push:
    branches: [prod]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/sjkcodez/promokote-backend
  FRONTEND_IMAGE: ghcr.io/sjkcodez/promokote-frontend

permissions:
  contents: read
  packages: write

jobs:
  # ── Build backend ────────────────────────────────────────────────────────────
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Build frontend ───────────────────────────────────────────────────────────
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          # VITE_API_URL is baked into the JS bundle at build time.
          # Update this to your real API domain once DNS is pointed.
          build-args: |
            VITE_API_URL=https://api.promokote.com
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy ───────────────────────────────────────────────────────────────────
  deploy:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: docker-compose.prod.yml
          target: promokote-deploy
          strip_components: 0

      - name: Pull images and restart stack
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/promokote-deploy

            # ── Guard: .env must exist and have required vars ──────────────────
            if [ ! -f .env ]; then
              echo "ERROR: ~/promokote-deploy/.env is missing on the server."
              echo "Copy .env.prod.example from the repo as .env and fill in real values — see DEPLOY.md."
              exit 1
            fi

            for var in DJANGO_SECRET_KEY DB_NAME DB_USER DB_PASSWORD; do
              if ! grep -qE "^${var}=.+" .env; then
                echo "ERROR: ${var} is missing or blank in ~/promokote-deploy/.env — refusing to deploy."
                echo "See DEPLOY.md / .env.prod.example."
                exit 1
              fi
            done

            # ── Log into GHCR with the run-scoped token (no stored secret) ────
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # ── Rolling restart ────────────────────────────────────────────────
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d db
            docker compose -f docker-compose.prod.yml run --rm backend python manage.py migrate --noinput
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f

